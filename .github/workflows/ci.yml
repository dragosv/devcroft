name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt, clippy, rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      # `cargo clippy` alone (no --all-targets) is the exact command
      # CLAUDE.md documents as "currently clean" — -D warnings turns that
      # description into an enforced gate instead of a claim that can go
      # stale silently.
      - run: cargo clippy -- -D warnings

      # docs.rs renders this publicly; CLAUDE.md says keep it at zero
      # warnings.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The provider-free leg, on both OSes. Every e2e test self-skips on a
  # host without its provider (CLAUDE.md: "a green cargo test is not the
  # same as a run that tested anything"), so this measures the unit tests
  # and the process tier alone — which on macOS is real signal, since
  # Seatbelt is native and needs no daemon. It is also the control for the
  # skip logic itself: a test that *fails* here instead of skipping is
  # guarding on the binary rather than the capability. Provider coverage
  # is the `e2e` matrix below.
  #
  # The fixture-driven tests (`tests/common::for_each_row`) are the one
  # place "no provider" is not a skip: their default row is a real nix
  # closure, and an unavailable *default* row fails the run by design —
  # "will not fall back to something cheaper behind your back". So this
  # leg asks for the cheaper row by name: `test`, the nix-free row that
  # drives `up` through the injection seam, which exists only under
  # `--features test-support` and is precisely the row for a host without
  # a Nix store. That feature gates the seam and nothing else
  # (`src/lib.rs`), so every other test runs exactly as it does without
  # it. Without this, all seven fixture-driven binaries panic here on
  # both OSes.
  test:
    name: unit + process tier, no provider (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # ubuntu-24.04 (what `ubuntu-latest` resolves to) ships AppArmor's
      # `apparmor_restrict_unprivileged_userns=1`, which refuses an
      # unprivileged `unshare(CLONE_NEWUSER|CLONE_NEWNS)`. Every `up` on
      # Linux needs exactly that since `add-mount-isolation` — measured on
      # run 34823186189, where all five Linux legs failed at their first
      # `up` with "this host cannot create unprivileged mount namespaces".
      # The devcontainer never hit it (Docker's default profile allows it).
      - name: allow unprivileged user namespaces (ubuntu 24.04 AppArmor default)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --mount --map-root-user true && echo "user+mount namespaces: ok"

      - run: cargo build

      # One run, not two. This step used to be a plain `cargo test`
      # followed by a second, full `cargo test -- --nocapture | grep
      # skipping` — the whole suite twice, for a log line. The
      # step-level timeout is the real point though: a test that hangs
      # (rather than fails) otherwise burns GitHub's 6h job ceiling, as
      # the macos-latest leg of run 33546435126 did at 6h5m.
      # `test` on Linux: the nix-free row, and nothing else can run there.
      # `all` on macOS: the swift row *is* available there — the runner
      # image ships Xcode — so the lifecycle matrix (`for_each_row`:
      # up/down/recreate/status/stale/exec/shell/worktree) runs under the
      # artifact tier's only provider on every push, next to the nix-free
      # row; nix, flox and devbox skip by name with the reason. `all`
      # passes when at least one row ran and fails if every row skipped,
      # so a macOS runner that lost its toolchain is a red leg, not a
      # quiet one.
      - name: cargo test
        timeout-minutes: 20
        env:
          DEVCROFT_TEST_PROVIDER: ${{ runner.os == 'macOS' && 'all' || 'test' }}
        run: |
          set -o pipefail
          cargo test --no-fail-fast --features test-support -- --nocapture 2>&1 | tee /tmp/test-output.txt

      - name: report what actually ran vs. self-skipped
        if: always()
        run: grep -iE "skipping|provider matrix" /tmp/test-output.txt || true

  packaging:
    name: cargo package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo package --locked --allow-dirty --no-verify

      - name: verify the shipped file list
        run: |
          set -eu
          cargo package --locked --allow-dirty --no-verify --list > /tmp/pkg-list.txt
          cat /tmp/pkg-list.txt

          # Regression guard for exactly the gap that shipped once before:
          # a file the shipped NOTICE/README-crate.md promise, silently
          # missing from Cargo.toml's include allowlist.
          for f in README-crate.md LICENSE-APACHE NOTICE THIRD-PARTY-LICENSES.md; do
            grep -qx "$f" /tmp/pkg-list.txt || { echo "missing from package: $f"; exit 1; }
          done

          # README.md is GitHub-only (relative links to docs/, samples/,
          # openspec/ don't resolve from an unpacked crate); spike.rs is a
          # design proof for this repo, not a binary anyone installs.
          for f in README.md src/bin/spike.rs; do
            grep -qx "$f" /tmp/pkg-list.txt && { echo "should not ship: $f"; exit 1; }
          done

          if grep -qE '^(openspec|samples|\.claude|\.devcontainer|tests)/' /tmp/pkg-list.txt; then
            echo "package pulled in a repo-internal directory"
            exit 1
          fi

  openspec:
    name: openspec validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec validate --all

  # One job per provider, in parallel, each installing only its own
  # tooling. This used to be a single `e2e-linux` job with flox + devbox
  # on one runner (and flox's nix serving the nix provider), so a failure
  # in one provider's closure build held the others' results hostage and
  # the 45-minute budget was one serial wall. Selection is by
  # *availability*, not by a hand-maintained list of test binaries: every
  # e2e test self-skips when its provider is absent, and the fixture-driven
  # ones (`tests/common::for_each_row`) take `DEVCROFT_TEST_PROVIDER` — so
  # each leg runs the full suite and the "report" step shows what that leg
  # actually exercised. A list of binaries per provider would rot the
  # first time a test moved.
  #
  # Two things worth knowing before editing:
  #
  # - The flox leg deliberately leaves `nix-command`/`flakes` OFF for the
  #   bare `nix` binary flox puts on PATH. `provider::nix` and
  #   `provider::devbox` call that binary directly and self-skip with "nix
  #   present but flakes not enabled" without it; flox itself uses its
  #   own wrapper and does not care. Enabling them there would make the
  #   flox leg run the nix suite a second time. The nix leg gets its nix
  #   from install-nix-action, flakes on.
  # - devenv has no `for_each_row` row yet (the fixture knows nix, flox,
  #   devbox), so that leg selects the nix row for the matrix tests and
  #   covers devenv through its own binaries (`devenv_provider_e2e`,
  #   `devenv_capture_contract`, the devenv half of `services_e2e`).
  #   Adding the row belongs to the fixture change, not to CI.
  #
  # The devenv leg, as of run 34823971268: the provider itself works on
  # the runner — `devenv_provider_e2e` passes 15/15 (closure compile,
  # supervised processes, readiness, the hook running inside). What fails
  # is `devenv_capture_contract`'s two `resolve` calls, where
  # `devenv build shell` dies in *evaluation* of `devenv-nixpkgs/rolling`
  # with `error: path '/nix/store/…-setup-hook.sh' is not valid` — a nix
  # evaluator/daemon problem under install-nix-action's nix plus devenv's
  # bundled one, not a devcroft one, and not reproduced locally (flox's
  # nix-daemon, macOS). Undiagnosed; the leg stays continue-on-error and
  # that binary's log is the next thing to read.
  #
  # Pinned versions match what the project was measured against: flox and
  # devbox the same as `.devcontainer/Dockerfile`, devenv the version the
  # provider was written against (`add-devenv-provider`).
  #
  # flox, nix and devbox are blocking: green on run 34829168323, after
  # seven dispatched runs that each found something real (user
  # namespaces refused by AppArmor, a lost /dev/ptmx grant, a ptmx bind
  # the kernel cannot open, a golden recorded on the wrong platform —
  # docs/implementation-log.md has the list). devenv stays
  # continue-on-error for the one failure above, which is nix's, until
  # someone reads that log.
  e2e:
    name: e2e (${{ matrix.provider }})
    strategy:
      fail-fast: false
      matrix:
        provider: [flox, nix, devbox, devenv]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.provider == 'devenv' }}
    env:
      DEVBOX_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Build artifacts are provider-independent; share one cache
          # across the four legs and with the `test` job's ubuntu leg.
          key: ubuntu-latest

      # ubuntu-24.04 (what `ubuntu-latest` resolves to) ships AppArmor's
      # `apparmor_restrict_unprivileged_userns=1`, which refuses an
      # unprivileged `unshare(CLONE_NEWUSER|CLONE_NEWNS)`. Every `up` on
      # Linux needs exactly that since `add-mount-isolation` — measured on
      # run 34823186189, where all five Linux legs failed at their first
      # `up` with "this host cannot create unprivileged mount namespaces".
      # The devcontainer never hit it (Docker's default profile allows it).
      - name: allow unprivileged user namespaces (ubuntu 24.04 AppArmor default)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --mount --map-root-user true && echo "user+mount namespaces: ok"

      # --- flox: its own installer provisions a private Nix store and
      # nix-daemon (there is no separate system-wide Nix install anywhere
      # in this repo's own Dockerfile either) — same pinned .deb, same live
      # SHA256SUMS verification the Dockerfile uses.
      - name: install flox (provides nix + nix-daemon)
        if: matrix.provider == 'flox'
        env:
          FLOX_VERSION: "1.14.0"
        run: |
          set -eu
          cd /tmp
          case "$(dpkg --print-architecture)" in
            amd64) FLOX_ARCH=x86_64 ;;
            arm64) FLOX_ARCH=aarch64 ;;
            *) echo "unsupported architecture: $(dpkg --print-architecture)" >&2; exit 1 ;;
          esac
          DEB="flox-${FLOX_VERSION}.${FLOX_ARCH}-linux.deb"
          curl -fsSLO "https://downloads.flox.dev/by-env/stable/deb/${DEB}"
          curl -fsSL "https://downloads.flox.dev/by-env/stable/flox-${FLOX_VERSION}.SHA256SUMS" \
            | grep "deb/${DEB}\$" | awk -v f="$DEB" '{print $1"  "f}' | sha256sum -c -
          sudo apt-get update && sudo apt-get install -y --no-install-recommends "./${DEB}"
          flox --version
          sudo service nix-daemon status || sudo service nix-daemon start

      # --- nix / devbox / devenv: a plain multi-user Nix with flakes on,
      # which is what those three providers' tests invoke directly.
      # `trusted-users` is what lets `--accept-flake-config` below actually
      # take devenv's binary cache from its flake rather than build devenv
      # from source on the runner.
      - name: install nix (flakes on)
        if: matrix.provider != 'flox'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-users = root runner

      - name: install devbox
        if: matrix.provider == 'devbox'
        env:
          DEVBOX_VERSION: "0.18.0"
        run: |
          set -eu
          cd /tmp
          case "$(dpkg --print-architecture)" in
            amd64) DEVBOX_ARCH=amd64 ;;
            arm64) DEVBOX_ARCH=arm64 ;;
            *) echo "unsupported architecture: $(dpkg --print-architecture)" >&2; exit 1 ;;
          esac
          TARBALL="devbox_${DEVBOX_VERSION}_linux_${DEVBOX_ARCH}.tar.gz"
          BASE="https://github.com/jetify-com/devbox/releases/download/${DEVBOX_VERSION}"
          curl -fsSLO "${BASE}/${TARBALL}"
          curl -fsSL "${BASE}/checksums.txt" | grep " ${TARBALL}\$" | sha256sum -c -
          tar xzf "${TARBALL}" devbox
          sudo mv devbox /usr/local/bin/devbox
          sudo chmod +x /usr/local/bin/devbox
          devbox version

      # devenv's own documented install, pinned. Its flake carries the
      # `devenv.cachix.org` substituter in `nixConfig`; `--accept-flake-config`
      # takes it, which is the difference between a download and a Rust
      # build of devenv on every run.
      - name: install devenv
        if: matrix.provider == 'devenv'
        env:
          DEVENV_VERSION: "v2.2.2"
        run: |
          set -eu
          nix profile install --accept-flake-config "github:cachix/devenv/${DEVENV_VERSION}"
          devenv version

      # Full suite, every leg; the provider that is installed is the one
      # whose tests run. `DEVCROFT_TEST_PROVIDER` is the fixture's row
      # selection — an explicitly selected row that turns out unavailable
      # *fails* the run rather than skipping (`tests/common/mod.rs`), which
      # is exactly the guard a per-provider leg wants: a leg whose provider
      # silently did not install must not pass on the unit tests alone.
      # `--no-fail-fast` on both legs: cargo otherwise stops at the first
      # failing test *binary*, so a leg reports one failure where it has
      # several — the first dispatched run showed exactly one binary per
      # leg, all with the same cause, and would have hidden a second.
      - name: cargo test
        timeout-minutes: 40
        env:
          DEVCROFT_TEST_PROVIDER: ${{ matrix.provider == 'devenv' && 'nix' || matrix.provider }}
        run: |
          set -o pipefail
          cargo test --no-fail-fast -- --nocapture 2>&1 | tee /tmp/test-output.txt

      - name: report what actually ran vs. self-skipped
        if: always()
        run: grep -iE "skipping|provider matrix" /tmp/test-output.txt || true
