schema-version = "1.14.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
gcc.pkg-path = "gcc"
rustfmt.pkg-path = "rustfmt"
rustfmt.version = "1.95.0"
rustc.pkg-path = "rustc"
rustc.version = "1.95.0"
cargo.pkg-path = "cargo"
cargo.version = "1.95.0"
clippy.pkg-path = "clippy"
clippy.version = "1.95.0"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# No rustup here: rustc/cargo/clippy/rustfmt are installed directly above,
# pinned to an exact version (1.97.0) by flox's own lockfile — the closure
# guarantee already covers the compiler version, so a separate toolchain
# manager isn't needed on top of it (unlike samples/flox-rustup-sample,
# which pins the version via rust-toolchain.toml instead, for projects
# that want rustup's per-project-pin workflow specifically).
#
# cargo still defaults CARGO_HOME to the *host's* location (e.g.
# /usr/local/cargo in devcroft's own devcontainer, or ~/.cargo — either
# way outside this project), so a devcroft-sandboxed session correctly
# denies writing there. Redirected into the project instead, using
# $FLOX_ENV_PROJECT (flox's own absolute path to the project root — must
# be absolute, nono rejects a relative TMPDIR outright, confirmed while
# building flox-rustup-sample).
#
# `cargo fetch` then downloads this crate's real crates.io dependencies
# (clap, chrono, chrono-tz) into that project-local registry cache,
# host-side, at `up`, before the sandbox restriction — so
# `devcroft exec -- cargo build` never needs network access at session
# time.
on-activate = '''
  export CARGO_HOME="$FLOX_ENV_PROJECT/.cargo"
  export TMPDIR="$FLOX_ENV_PROJECT/.tmp"
  mkdir -p "$CARGO_HOME" "$TMPDIR"
  cd "$FLOX_ENV_PROJECT" && cargo fetch
'''
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


