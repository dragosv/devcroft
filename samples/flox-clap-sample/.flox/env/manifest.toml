schema-version = "1.14.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
gcc.pkg-path = "gcc"
rustup.pkg-path = "rustup"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# Same pattern as samples/flox-rustup-sample (see that sample's README for
# the full reasoning): rustup/cargo/the linker default to the *host's*
# RUSTUP_HOME/CARGO_HOME/TMPDIR, outside this project, so a devcroft-
# sandboxed session correctly denies writing there. Redirected into the
# project via $FLOX_ENV_PROJECT (flox's own absolute path to the project
# root — must be absolute, nono rejects a relative TMPDIR outright).
#
# Two things get materialized here, host-side, before the sandbox
# restriction applies, so `devcroft exec -- cargo build` never needs
# network access at session time: `rustup show` installs the
# rust-toolchain.toml pin (1.97.0), and `cargo fetch` (this crate has real
# crates.io dependencies — clap, chrono, chrono-tz — unlike
# flox-rustup-sample, which had none) downloads every dependency into
# CARGO_HOME's registry cache. Without this second step, `cargo build`
# inside the sandbox fails trying to reach index.crates.io.
on-activate = '''
  export RUSTUP_HOME="$FLOX_ENV_PROJECT/.rustup"
  export CARGO_HOME="$FLOX_ENV_PROJECT/.cargo"
  export TMPDIR="$FLOX_ENV_PROJECT/.tmp"
  mkdir -p "$RUSTUP_HOME" "$CARGO_HOME" "$TMPDIR"
  rustup show > /dev/null
  cd "$FLOX_ENV_PROJECT" && cargo fetch
'''
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


