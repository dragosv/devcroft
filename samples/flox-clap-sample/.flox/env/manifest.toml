## Other Environment Options -----------------------------------------
[options]
# rustc/cargo/clippy/rustfmt are pinned to an exact version below. 1.96
# and 1.97 aren't published for x86_64-darwin in nixpkgs (only
# aarch64-darwin/aarch64-linux/x86_64-linux); 1.95.0 is the most recent
# version that covers all four platforms devcroft supports, which is why
# that's the pin here rather than a newer one — verified via
# `flox show rustc`/`cargo`/`clippy`/`rustfmt` before picking it.
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-darwin",
  "x86_64-linux",
]
# Uncomment to disable CUDA detection.
# cuda-detection = false
