[sandbox]
name = "nix-go-sample"

[env]
provider = "nix"

# A web server needs to bind a listening socket. devcroft's default
# network policy (network.default = "deny") denies bind()/listen()
# outright, loopback included — confirmed directly against this sample:
# `bind: operation not permitted`. This is not a nix- or Go-specific
# problem; it is docs/ssh-validation.md's own tracked, highest-priority
# gap ("no dev server can bind a port under the default policy"), and
# `network.default = "allow"` is the documented workaround until a
# dedicated "permit listen, deny egress" knob exists.
[network]
default = "allow"
