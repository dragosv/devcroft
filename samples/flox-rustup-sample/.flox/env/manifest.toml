schema-version = "1.14.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
rustup.pkg-path = "rustup"
gcc.pkg-path = "gcc"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# rustup/cargo/the linker otherwise use RUSTUP_HOME/CARGO_HOME/TMPDIR from
# wherever the *host's own* toolchain lives (e.g. /usr/local/rustup,
# /tmp in devcroft's own devcontainer) — outside this project, so a
# sandboxed session correctly denies writing there. Redirected into the
# project instead, using $FLOX_ENV_PROJECT (flox's own absolute path to
# the project root) rather than a relative path: nono validates some
# well-known vars (confirmed: TMPDIR) and rejects a relative value
# outright, so these must be absolute — [vars] above can't do that, since
# its values are literal strings with no shell interpolation (same
# constraint devcroft's own `[env] vars` documents); this hook is real
# bash, so it can.
#
# Also materializes the rust-toolchain.toml pin now, host-side, at flox
# activation — which devcroft's `up` runs *before* applying the sandbox
# restriction (see CLAUDE.md's "Two-phase execution": provisioning is
# trusted, host-network work; only sessions and hooks run inside the
# boundary). Doing it here means `devcroft exec -- cargo build` never
# needs network access at session time. `rustup show` is what triggers
# rustup's own auto-install of whatever rust-toolchain.toml pins.
on-activate = '''
  export RUSTUP_HOME="$FLOX_ENV_PROJECT/.rustup"
  export CARGO_HOME="$FLOX_ENV_PROJECT/.cargo"
  export TMPDIR="$FLOX_ENV_PROJECT/.tmp"
  mkdir -p "$RUSTUP_HOME" "$CARGO_HOME" "$TMPDIR"
  rustup show > /dev/null
'''
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


