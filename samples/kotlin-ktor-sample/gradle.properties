# The Gradle daemon persists across invocations of the same on-disk
# GRADLE_USER_HOME to save JVM startup cost on a normal dev machine —
# but each `devcroft exec` is its own fresh process group, torn down
# with the session (keeper/connection.rs's grace-period SIGTERM then
# SIGKILL), so a daemon started by one exec has no session to survive
# into for a next one to reuse. Left running, it would just be an
# orphaned background JVM inside (or outside, depending on tier) the
# sandbox. Disabled here rather than left to accumulate; every command
# in this sample's README also passes --no-daemon explicitly, since
# this setting alone does not stop a daemon already started before it
# was added.
org.gradle.daemon=false
