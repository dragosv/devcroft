[sandbox]
name = "devenvcopilot"

[env]
provider = "devenv"
# Keys reach the sandbox from your shell, never from this file.
forward = ["COPILOT_GITHUB_TOKEN"]

[network]
default = "deny"
# The agent's API, and nothing else (see README.md for what it also tries).
allow = [
  "api.github.com",
  "api.githubcopilot.com",
]
