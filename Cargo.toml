[package]
name = "devcroft"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.189"
rand = "0.10.2"
russh = "0.62.5"
russh-sftp = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
toml = "1.1.4"
