[package]
name = "devcroft"
# 0.0.x, not 0.1.x, and deliberately: cargo treats every 0.0.z as
# incompatible with every other, which is the only range that matches what
# `src/lib.rs` already states — the modules are internals, published so the
# integration suite can drive them, with no stability guarantee. A 0.1.0
# would promise patch-compatibility this crate does not intend to keep, and
# would claim a boundary `docs/known-gaps.md` says is still open (AF_UNIX).
# See `docs/roadmap.md` for when 0.1.0 gets cut.
version = "0.0.1"
edition = "2024"
# Edition 2024 needs 1.85; nono 0.82 needs 1.95, and a declared floor below
# a dependency's is a lie cargo only catches at resolve time on the old
# toolchain. Stated explicitly so a too-old toolchain reports that rather
# than failing with syntax errors deep in the build. Matches
# .devcontainer/Dockerfile.
rust-version = "1.95"
description = "Isolated, reproducible development environments built on OS-level sandboxing (Landlock/Seatbelt), each reachable over SSH"
license = "Apache-2.0"
repository = "https://github.com/dragosv/devcroft"
homepage = "https://github.com/dragosv/devcroft"
readme = "README-crate.md"
keywords = ["sandbox", "landlock", "devcontainer", "ssh", "reproducible"]
categories = ["command-line-utilities", "development-tools"]
# An allowlist, not an `exclude` denylist: the default package swept in
# 131 `openspec/` files, `.claude/`, `.devcontainer/` and `samples/` —
# ~175 files irrelevant to a consumer, published permanently. An
# allowlist cannot silently regain them when a new directory appears.
# `tests/` is deliberately out: every integration test needs a real
# flox/nix environment and a Landlock host, so it cannot run from an
# unpacked crate anyway — it lives in the repository, which `repository`
# above points at.
# Leading `/` anchors each pattern to the package root. Without it these
# are gitignore-style matches at *any* depth, which pulled in every
# `README.md` and `LICENSE` under `samples/` — including ones inside
# `.flox/run/` store symlinks and a vendored Go module cache.
# `!/src/bin/spike.rs` is load-bearing, not tidiness: bin targets are
# auto-discovered from `src/bin/`, so shipping that file would make
# `cargo install devcroft` put a second, generically-named `spike` binary
# on the user's PATH. Excluding the source removes the target — the spike
# is a design proof for this repository, not a program anyone installs.
# `README.md` itself is deliberately NOT shipped: it's the GitHub-facing
# doc (architecture, comparisons, status, full command surface) and
# assumes a repo checkout — its relative links to docs/, samples/, and
# openspec/changes/ don't resolve from an unpacked crate. The crate ships
# `README-crate.md` instead: install + quick-start only, same split
# nono-cli uses between its GitHub README and its crate README.
include = ["/src/**/*.rs", "!/src/bin/spike.rs", "/README-crate.md", "/LICENSE-APACHE", "/NOTICE", "/THIRD-PARTY-LICENSES.md"]

[features]
# Off by default, and that is the whole point: `tests/` compiles this crate
# as an ordinary dependency, *without* `cfg(test)`, so a test seam cannot
# ride on `cfg(test)`. A feature can carry it — but only while it stays out
# of a default build, so the published binary contains no way to drive `up`
# with a provider no manifest could name.
test-support = []

[dependencies]
base64 = "0.22.1"
libc = "0.2.189"
# Exact, not caret (`add-linux-agent-fleet` D10): nono is pre-1.0 and its
# minor versions break, and it is the crate that turns the policy into
# Landlock and Seatbelt rules. A caret lets `cargo update` change what is
# enforced with no source change at all. An upgrade is scheduled work: bump
# this, then run the full suite inside a delegated cgroup with the store
# reachable (CLAUDE.md), so the boundary tests (`process_tier_landlock_boundaries`,
# `udp_egress_denied`, `abstract_socket_not_reachable`, `unix_socket_not_mediated`,
# `fleet_init`) run rather than skip. They assert what is refused, not that
# the types still line up.
nono = "=0.82.0"
# The egress proxy's HTTP handling (`add-agent-workload` 4b.0, adopted
# 2026-11-15 after design.md Decision 6's investigation). Exact, and always
# the same version as `nono`: it depends on the matching `nono`, and two
# copies of nono in one binary would be two sets of capability types.
# `default-features = false` drops its OS-keyring feature, which devcroft
# does not use. It brings ~95 crates nothing here calls (the AWS SDK,
# SPIFFE/tonic, rcgen): not feature-gated upstream, accepted by the owner.
nono-proxy = { version = "=0.82.0", default-features = false }
rand = "0.10.2"
russh = "0.62.5"
russh-sftp = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `nono_proxy::ProxyConfig::session_token` is a `Zeroizing<String>`; already
# in the tree through nono, named here only to construct it.
zeroize = "1"
serde_norway = "0.9.42"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
toml = "1.1.4"
# Preserve source spans when ordering mise's environment directives. Both
# packages already exist in the lockfile; object becomes a runtime dependency.
toml_edit = { version = "0.25.13", default-features = false, features = ["parse", "display"] }
sha2 = "0.11.0"
object = { version = "0.37.3", default-features = false, features = ["read", "std", "elf", "macho"] }

# The base runtime (`add-own-userland`): uutils coreutils linked into the
# `devcroft` binary and dispatched on `argv[0]` (`src/runtime/applets.rs`).
# Pinned exactly: their versions are part of the runtime generation
# (`runtime::GENERATION`), so a bump here is a new generation.
uucore = "=0.13.0"
uu_env = "=0.13.0"
uu_ls = "=0.13.0"
uu_cat = "=0.13.0"
uu_cp = "=0.13.0"
uu_mv = "=0.13.0"
uu_rm = "=0.13.0"
uu_mkdir = "=0.13.0"
uu_rmdir = "=0.13.0"
uu_ln = "=0.13.0"
uu_touch = "=0.13.0"
uu_head = "=0.13.0"
uu_tail = "=0.13.0"
uu_wc = "=0.13.0"
uu_sort = "=0.13.0"
uu_uniq = "=0.13.0"
uu_cut = "=0.13.0"
uu_tr = "=0.13.0"
uu_echo = "=0.13.0"
uu_printf = "=0.13.0"
uu_test = "=0.13.0"
uu_pwd = "=0.13.0"
uu_true = "=0.13.0"
uu_false = "=0.13.0"
uu_seq = "=0.13.0"
uu_basename = "=0.13.0"
uu_dirname = "=0.13.0"
uu_readlink = "=0.13.0"
uu_realpath = "=0.13.0"
uu_stat = "=0.13.0"
uu_chmod = "=0.13.0"
uu_mktemp = "=0.13.0"
uu_tee = "=0.13.0"
uu_date = "=0.13.0"
uu_id = "=0.13.0"
uu_uname = "=0.13.0"
uu_hostname = "=0.13.0"
uu_yes = "=0.13.0"
uu_sleep = "=0.13.0"
uu_nohup = "=0.13.0"

[dev-dependencies]
# A local TLS upstream for the brokered-credential tests (`proxy::server`).
# Both are already in the tree through `nono-proxy`, so neither adds a crate.
rcgen = "0.14"
rustls = "0.23"
brush-shell = "0.4.0"
# `uu_echo`, `uu_pwd` and `uu_sleep` for `examples/test-row-sh.rs` come from
# `[dependencies]` since `add-own-userland` linked the runtime in.
