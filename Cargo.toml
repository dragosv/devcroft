[package]
name = "devcroft"
# 0.0.x, not 0.1.x, and deliberately: cargo treats every 0.0.z as
# incompatible with every other, which is the only range that matches what
# `src/lib.rs` already states — the modules are internals, published so the
# integration suite can drive them, with no stability guarantee. A 0.1.0
# would promise patch-compatibility this crate does not intend to keep, and
# would claim a boundary `docs/known-gaps.md` says is still open (AF_UNIX).
# See `docs/roadmap.md` for when 0.1.0 gets cut.
version = "0.0.1"
edition = "2024"
# Edition 2024 requires 1.85; stated explicitly so a too-old toolchain
# reports that rather than failing with syntax errors deep in the build.
rust-version = "1.85"
description = "Isolated, reproducible development environments built on OS-level sandboxing (Landlock/Seatbelt), each reachable over SSH"
license = "Apache-2.0"
repository = "https://github.com/dragosv/devcroft"
homepage = "https://github.com/dragosv/devcroft"
readme = "README.md"
keywords = ["sandbox", "landlock", "devcontainer", "ssh", "reproducible"]
categories = ["command-line-utilities", "development-tools"]
# An allowlist, not an `exclude` denylist: the default package swept in
# 131 `openspec/` files, `.claude/`, `.devcontainer/` and `samples/` —
# ~175 files irrelevant to a consumer, published permanently. An
# allowlist cannot silently regain them when a new directory appears.
# `tests/` is deliberately out: every integration test needs a real
# flox/nix environment and a Landlock host, so it cannot run from an
# unpacked crate anyway — it lives in the repository, which `repository`
# above points at.
# Leading `/` anchors each pattern to the package root. Without it these
# are gitignore-style matches at *any* depth, which pulled in every
# `README.md` and `LICENSE` under `samples/` — including ones inside
# `.flox/run/` store symlinks and a vendored Go module cache.
# `!/src/bin/spike.rs` is load-bearing, not tidiness: bin targets are
# auto-discovered from `src/bin/`, so shipping that file would make
# `cargo install devcroft` put a second, generically-named `spike` binary
# on the user's PATH. Excluding the source removes the target — the spike
# is a design proof for this repository, not a program anyone installs.
include = ["/src/**/*.rs", "!/src/bin/spike.rs", "/README.md", "/LICENSE-APACHE", "/NOTICE"]

[dependencies]
base64 = "0.22.1"
libc = "0.2.189"
nono = "0.74.0"
rand = "0.10.2"
russh = "0.62.5"
russh-sftp = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
toml = "1.1.4"
