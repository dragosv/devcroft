[package]
name = "devcroft-guest-keeper"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nono = { version = "=0.77.0", default-features = false }
russh = "=0.62.5"
russh-sftp = "=2.4.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }

[dev-dependencies]
rand = "0.10.2"
tempfile = "3"
tokio = { version = "1", features = ["process"] }

[profile.release]
strip = true

# Experimental receive-window seam; default production dependency is unchanged.
[patch.crates-io]
russh = { path = "../russh" }
