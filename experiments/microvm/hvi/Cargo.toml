[package]
name = "devcroft-hvi-spike"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[dependencies]
hvi = { path = "../artifacts/hvi-source" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.dev.package.sha2]
opt-level = 3

[build-dependencies]
serde_json = "1"
