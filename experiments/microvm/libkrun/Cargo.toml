[package]
name = "devcroft-krun-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Independent workspace/lockfile: the experiment must not enter devcroft's
# default build, release dependency graph or cargo-install targets.
[workspace]

[dependencies]
krun = { package = "libkrun", path = "../artifacts/libkrun-source/src/libkrun", default-features = false, features = ["blk"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"
